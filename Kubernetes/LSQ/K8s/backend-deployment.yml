apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: association-backend
  template:
    metadata:
      labels:
        app: association-backend
    spec:
      containers:
      - name: backend-container
        image: aishwaryakr/association-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5248
        env:
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_CONN
        - name: ConnectionStrings__RedisConnection
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_CONN
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_KEY
        - name: Jwt__Issuer
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: JWT_ISSUER
        - name: Jwt__Audience
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: JWT_AUDIENCE
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: NodePort
  selector:
    app: association-backend
  ports:
  - port: 5248
    targetPort: 5248
    nodePort: 30248
