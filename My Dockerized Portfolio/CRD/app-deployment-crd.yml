apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
 name: appdeployments.platform.example.com
spec:
 group: platform.example.com
 scope: Namespaced
 names:
  plural: appdeployments
  singular: appdeployment
  kind: AppDeployment
  shortNames:
   - appd
 versions:
  - name: v1
    served: true
    storage: true
    schema:
     openAPIV3Schema:
      type: object
      properties:
       spec:
        type: object
        properties:
         image:
          type: string
         replicas:
          type: integer
         port:
          type: integer
         host:
          type: string
